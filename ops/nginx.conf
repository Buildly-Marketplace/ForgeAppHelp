# Static server for the built frontend.
#
# try_files falls back to index.html so client-side routes (/settings, /help)
# resolve on a hard refresh instead of 404ing -- every SPA router needs this.
server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or
    # clients pin themselves to a stale bundle after a deploy.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
